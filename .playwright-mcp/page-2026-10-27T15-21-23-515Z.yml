          - generic [ref=f5e69]:
            - generic [ref=f5e70]:
              - term [ref=f5e71]: Carry-out
              - definition [ref=f5e72]: "A adder's over-bit: the bit that no longer fits the result width."
              - definition [ref=f5e73]: ch 5
            - generic [ref=f5e74]:
              - term [ref=f5e75]: Case
              - definition [ref=f5e76]: A procedural multi-way branch; it must cover every possible value (or have a default) or it silently builds a latch.
              - definition [ref=f5e77]: ch 4
            - generic [ref=f5e78]:
              - term [ref=f5e79]: Casez
              - definition [ref=f5e80]: A case variant that treats ? items as don't-care — the idiom for priority matching.
              - definition [ref=f5e81]: ch 7
            - generic [ref=f5e82]:
              - term [ref=f5e83]: Clock
              - definition [ref=f5e84]: The periodic signal that paces all sequential logic; registers only change on its edge.
              - definition [ref=f5e85]: ch 8
            - generic [ref=f5e86]:
              - term [ref=f5e87]: Combinational
              - definition [ref=f5e88]: Logic whose output is a pure function of its current inputs — no memory, no clock.
              - definition [ref=f5e89]: ch 3
            - generic [ref=f5e90]:
              - term [ref=f5e91]: Concatenation
              - definition [ref=f5e92]: "{a, b} — joining signals bit-wise into one wider value."
              - definition [ref=f5e93]: ch 3
            - generic [ref=f5e94]:
              - term [ref=f5e95]: Counter
              - definition [ref=f5e96]: A register that increments (usually with wraparound) on every enabled clock edge.
              - definition [ref=f5e97]: ch 9
