          - generic [ref=f5e19]:
            - generic [ref=f5e20]:
              - term [ref=f5e21]: Active-low
              - definition [ref=f5e22]: A control that does its job when it reads 0 (e.g. rst_n); the _n suffix is the convention.
              - definition [ref=f5e23]: ch 8
            - generic [ref=f5e24]:
              - term [ref=f5e25]: ALU
              - definition [ref=f5e26]: Arithmetic Logic Unit — a combinational block that computes add/sub/logic/compare operations selected by an opcode.
              - definition [ref=f5e27]: ch 12
            - generic [ref=f5e28]:
              - term [ref=f5e29]: Always block
              - definition [ref=f5e30]: "Verilog's procedural container: always @(*) re-computes like a circuit, always @(posedge clk) acts once per clock edge."
              - definition [ref=f5e31]: ch 3
            - generic [ref=f5e32]:
              - term [ref=f5e33]: Assign
              - definition [ref=f5e34]: "A continuous assignment: the output re-computes whenever any input changes — hardware, not a one-time statement."
              - definition [ref=f5e35]: ch 1
            - generic [ref=f5e36]:
              - term [ref=f5e37]: Asynchronous reset
              - definition [ref=f5e38]: A reset that acts immediately, without waiting for a clock edge.
              - definition [ref=f5e39]: ch 8
        - generic [ref=f5e40]:
          - heading "B" [level=2] [ref=f5e41]
          - generic [ref=f5e42]:
            - generic [ref=f5e43]:
              - term [ref=f5e44]: Baud
              - definition [ref=f5e45]: The serial bit rate of a UART link; one baud tick is the time slot of one bit.
              - definition [ref=f5e46]: ch 14
            - generic [ref=f5e47]:
              - term [ref=f5e48]: Baud tick
              - definition [ref=f5e49]: A one-cycle pulse of baud_en that advances the UART state machine by exactly one bit time.
              - definition [ref=f5e50]: ch 14
            - generic [ref=f5e51]:
              - term [ref=f5e52]: Bit
              - definition [ref=f5e53]: "One binary wire or value: it is either 0 or 1, forever."
              - definition [ref=f5e54]: ch 1
            - generic [ref=f5e55]:
              - term [ref=f5e56]: Blocking assignment
              - definition [ref=f5e57]: "The = of procedural code: statements run strictly in order. Wrong inside clocked blocks — use nonblocking there."
              - definition [ref=f5e58]: ch 8
            - generic [ref=f5e59]:
              - term [ref=f5e60]: Boot image
              - definition [ref=f5e61]: The fixed memory contents a ROM starts with, often loaded from a text file with $readmemh.
              - definition [ref=f5e62]: ch 13
            - generic [ref=f5e63]:
              - term [ref=f5e64]: Bypass
              - definition [ref=f5e65]: A mux that shortcuts freshly-written data to a reader in the same cycle (the write-first read-during-write trick).
              - definition [ref=f5e66]: ch 12
        - generic [ref=f5e67]:
