        - generic [ref=e19]:
          - heading "Learn" [level=3] [ref=e20]
          - paragraph [ref=e21]: "Four full adders in a chain pass each carry into the next column: a ripple-carry adder. It is slow on purpose — the critical path is the carry rippling — but it is the honest, structural way to add N bits."
          - paragraph [ref=e22]: "Column i produces sum_i from a[i], b[i] and the carry out of column i-1. Watch the carry-out of the last column: carry-out ≠ overflow. Overflow is when the result sign is wrong (adding two positives yields negative); carry-out is just bit N leaving the bus. A `parameter N` lets the same structure serve 4-, 8- or 32-bit buses."
          - generic [ref=e23]:
            - code [ref=e25]: "module ripple_carry #( parameter N = 8 )( input wire [N-1:0] a, b, input wire cin, output wire [N-1:0] sum, output wire cout ); wire [N-1:0] carry; assign carry[0] = cin; genvar i; generate for (i = 0; i < N; i = i + 1) begin : cols full_adder fa ( .a(a[i]), .b(b[i]), .cin(carry[i]), .sum(sum[i]), .cout(carry[i+1]) ); end endgenerate assign cout = carry[N]; endmodule"
            - paragraph [ref=e26]: "Named instantiation (`.port(sig)`) is the safe style — positional port order breaks when a port list changes."
          - list [ref=e27]:
            - listitem [ref=e28]:
              - generic [ref=e30]: PINMISSING fires when a port is left unconnected; an open carry-out is how pins go missing in generated loops.
            - listitem [ref=e31]:
              - generic [ref=e33]: "For unsigned `a + b`, overflow needs a wider result to be seen at all — you cannot detect it from the adder alone without the sign context."
            - listitem [ref=e34]:
