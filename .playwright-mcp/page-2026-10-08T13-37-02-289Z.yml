          - generic [ref=f17e53]:
            - heading "A bit is a switch, and a wire is a wire" [level=3] [ref=f17e54]
            - paragraph [ref=f17e55]: "Everything in digital hardware is built from one idea: a wire that is either pushed low or pushed high. Low we call 0. High we call 1. That single choice, repeated, is enough to compute anything — because you can build a rule that says \"this wire is high only when both those wires are high\". When people say hardware is digital, they mean exactly this: every wire is one of two states, with nothing in between. A bit is just the name for one of those on/off facts. A 4-bit signal is four of those wires bundled together and named as a group. Verilog's job is to let you describe those wires and the rules between them, in text, instead of with solder."
          - generic [ref=f17e56]:
            - heading "Describing hardware is not the same as running software" [level=3] [ref=f17e57]
            - paragraph [ref=f17e58]: "A Verilog module is not a recipe you execute line by line. It is a picture of a circuit that always exists. There is no \"then\" in hardware — everything is happening at once, all the time. This is why Verilog has no `if` at the top level and no loop at the top level. Instead you write rules: \"this output equals that expression\". The tool reads all your rules together and builds the circuit. The word *synthesis* just means that conversion — turning your written rules into a real netlist of gates. This chapter is called Synthesis Foundations because everything later in the track is a more elaborate way of writing rules that become gates."
