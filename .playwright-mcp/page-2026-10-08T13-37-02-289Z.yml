              - complementary [ref=f17e102]:
                - paragraph [ref=f17e103]: The leftmost bit is the heaviest
                - paragraph [ref=f17e104]: "In `[3:0]`, a[3] has a value of 8, a[2] is worth 4, a[1] is worth 2, a[0] is worth 1. That is binary place value, exactly like decimal place value: in 457, the 4 is worth 400 and the 7 is worth 7. The high index is on the left because that is where the biggest value goes."
