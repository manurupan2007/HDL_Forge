    - generic [ref=f10e12]:
      - paragraph [ref=f10e13]: Why HDL Forge
      - heading "Verilog should be learned hands-on" [level=1] [ref=f10e14]
      - paragraph [ref=f10e15]: Mastering Verilog should not start with multi-gigabyte EDA installations and license queues. HDL Forge is an open-access, browser-native Verilog track that merges FreeCodeCamp's split-screen micro-lessons with CS50's evaluation rigor — Verilog Digital Design in 15 chapters, ending in a verified certificate.
