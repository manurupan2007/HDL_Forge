          - generic [ref=f10e19]:
            - paragraph [ref=f10e20]: HDLBits
            - paragraph [ref=f10e21]: Excellent problem bank for gates, but no guided theory, lesson context, or completion certification.
            - paragraph [ref=f10e22]: Adds structured curriculum and certification.
          - generic [ref=f10e23]:
            - paragraph [ref=f10e24]: EDA Playground
            - paragraph [ref=f10e25]: Powerful blank-slate sandbox; no step-by-step track, autograding, or progression.
            - paragraph [ref=f10e26]: Adds guided micro-tracks and automated grading.
          - generic [ref=f10e27]:
            - paragraph [ref=f10e28]: NPTEL / Coursera
            - paragraph [ref=f10e29]: Mostly passive video; no in-browser coding or instant waveform feedback.
            - paragraph [ref=f10e30]: Builds active, learn-by-doing practice.
          - generic [ref=f10e31]:
            - paragraph [ref=f10e32]: FreeCodeCamp
            - paragraph [ref=f10e33]: Split-screen lessons are effective but target software, not RTL design.
            - paragraph [ref=f10e34]: Retargets the model to Verilog.
