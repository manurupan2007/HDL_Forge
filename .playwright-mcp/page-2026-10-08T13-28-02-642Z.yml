          - generic [ref=f4e339]:
            - heading "Recap of the idea" [level=3] [ref=f4e340]
            - paragraph [ref=f4e341]: "Digital hardware speaks in fixed-width bit vectors. A 4-bit signal `a` is a bundle of four independent wires, each holding exactly one value: 0, 1, x (unknown) or z (floating)."
            - paragraph [ref=f4e342]: "A `module` is the unit of hardware: it declares ports (its interface) and a body that describes behavior. An `assign` drives an output continuously from an expression — every time an input changes, the output is re-evaluated. A truth table lists, for every combination of inputs, the output the hardware must produce; an `assign` is how you make the hardware honest to that table."
            - generic [ref=f4e343]:
              - code [ref=f4e345]: "module top ( input wire [3:0] a, input wire [3:0] b, output wire [3:0] y ); // One row of a truth table, expressed directly. assign y = (a == 4'b0011) && (b == 4'b0001) ? 4'b0001 : 4'b0000; endmodule"
              - paragraph [ref=f4e346]: "`[3:0]` means bit 3 is the most significant — keep the same ordering everywhere and your design reads top-to-bottom."
            - list [ref=f4e347]:
              - listitem [ref=f4e348]:
                - generic [ref=f4e350]: 4'b1010, 4'd10 and 4'hA are all the same ten. Read literals as width'base'value.
              - listitem [ref=f4e351]:
                - generic [ref=f4e353]: Verilator reports UNUSED and UNDRIVEN as style notes, not failures — a signal that is declared but never read is usually a mistake, but the design still lints.
              - listitem [ref=f4e354]:
                - generic [ref=f4e356]: "x and z are real 4-state values: x means unknown, z means high-impedance. Don't treat them as \"don't care\" yet."
          - generic [ref=f4e357]:
