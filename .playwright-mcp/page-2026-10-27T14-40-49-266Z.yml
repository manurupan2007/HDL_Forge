            - paragraph [ref=f2e21]: Excellent problem bank for gates, but no guided theory, lesson context, or completion certification.
            - paragraph [ref=f2e22]: Adds structured curriculum and certification.
          - generic [ref=f2e23]:
            - paragraph [ref=f2e24]: EDA Playground
            - paragraph [ref=f2e25]: Powerful blank-slate sandbox; no step-by-step track, autograding, or progression.
            - paragraph [ref=f2e26]: Adds guided micro-tracks and automated grading.
          - generic [ref=f2e27]:
            - paragraph [ref=f2e28]: NPTEL / Coursera
            - paragraph [ref=f2e29]: Mostly passive video; no in-browser coding or instant waveform feedback.
            - paragraph [ref=f2e30]: Builds active, learn-by-doing practice.
          - generic [ref=f2e31]:
            - paragraph [ref=f2e32]: FreeCodeCamp
            - paragraph [ref=f2e33]: Split-screen lessons are effective but target software, not RTL design.
            - paragraph [ref=f2e34]: Retargets the model to Verilog.
