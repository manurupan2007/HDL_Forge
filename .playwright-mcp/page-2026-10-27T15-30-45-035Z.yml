          - generic [ref=f19e69]:
            - generic [ref=f19e70]:
              - term [ref=f19e71]: Carry-out
              - definition [ref=f19e72]: "A adder's over-bit: the bit that no longer fits the result width."
              - definition [ref=f19e73]: ch 5
            - generic [ref=f19e74]:
              - term [ref=f19e75]: Case
              - definition [ref=f19e76]: A procedural multi-way branch; it must cover every possible value (or have a default) or it silently builds a latch.
              - definition [ref=f19e77]: ch 4
            - generic [ref=f19e78]:
              - term [ref=f19e79]: Casez
              - definition [ref=f19e80]: A case variant that treats ? items as don't-care — the idiom for priority matching.
              - definition [ref=f19e81]: ch 7
            - generic [ref=f19e82]:
              - term [ref=f19e83]: Clock
              - definition [ref=f19e84]: The periodic signal that paces all sequential logic; registers only change on its edge.
              - definition [ref=f19e85]: ch 8
            - generic [ref=f19e86]:
              - term [ref=f19e87]: Combinational
              - definition [ref=f19e88]: Logic whose output is a pure function of its current inputs — no memory, no clock.
              - definition [ref=f19e89]: ch 3
            - generic [ref=f19e90]:
              - term [ref=f19e91]: Concatenation
              - definition [ref=f19e92]: "{a, b} — joining signals bit-wise into one wider value."
              - definition [ref=f19e93]: ch 3
            - generic [ref=f19e94]:
              - term [ref=f19e95]: Counter
              - definition [ref=f19e96]: A register that increments (usually with wraparound) on every enabled clock edge.
              - definition [ref=f19e97]: ch 9
