          - generic [ref=f19e19]:
            - generic [ref=f19e20]:
              - term [ref=f19e21]: Active-low
              - definition [ref=f19e22]: A control that does its job when it reads 0 (e.g. rst_n); the _n suffix is the convention.
              - definition [ref=f19e23]: ch 8
            - generic [ref=f19e24]:
              - term [ref=f19e25]: ALU
              - definition [ref=f19e26]: Arithmetic Logic Unit — a combinational block that computes add/sub/logic/compare operations selected by an opcode.
              - definition [ref=f19e27]: ch 12
            - generic [ref=f19e28]:
              - term [ref=f19e29]: Always block
              - definition [ref=f19e30]: "Verilog's procedural container: always @(*) re-computes like a circuit, always @(posedge clk) acts once per clock edge."
              - definition [ref=f19e31]: ch 3
            - generic [ref=f19e32]:
              - term [ref=f19e33]: Assign
              - definition [ref=f19e34]: "A continuous assignment: the output re-computes whenever any input changes — hardware, not a one-time statement."
              - definition [ref=f19e35]: ch 1
            - generic [ref=f19e36]:
              - term [ref=f19e37]: Asynchronous reset
              - definition [ref=f19e38]: A reset that acts immediately, without waiting for a clock edge.
              - definition [ref=f19e39]: ch 8
        - generic [ref=f19e40]:
          - heading "B" [level=2] [ref=f19e41]
          - generic [ref=f19e42]:
            - generic [ref=f19e43]:
              - term [ref=f19e44]: Baud
              - definition [ref=f19e45]: The serial bit rate of a UART link; one baud tick is the time slot of one bit.
              - definition [ref=f19e46]: ch 14
            - generic [ref=f19e47]:
              - term [ref=f19e48]: Baud tick
              - definition [ref=f19e49]: A one-cycle pulse of baud_en that advances the UART state machine by exactly one bit time.
              - definition [ref=f19e50]: ch 14
            - generic [ref=f19e51]:
              - term [ref=f19e52]: Bit
              - definition [ref=f19e53]: "One binary wire or value: it is either 0 or 1, forever."
              - definition [ref=f19e54]: ch 1
            - generic [ref=f19e55]:
              - term [ref=f19e56]: Blocking assignment
              - definition [ref=f19e57]: "The = of procedural code: statements run strictly in order. Wrong inside clocked blocks — use nonblocking there."
              - definition [ref=f19e58]: ch 8
            - generic [ref=f19e59]:
              - term [ref=f19e60]: Boot image
              - definition [ref=f19e61]: The fixed memory contents a ROM starts with, often loaded from a text file with $readmemh.
              - definition [ref=f19e62]: ch 13
            - generic [ref=f19e63]:
              - term [ref=f19e64]: Bypass
              - definition [ref=f19e65]: A mux that shortcuts freshly-written data to a reader in the same cycle (the write-first read-during-write trick).
              - definition [ref=f19e66]: ch 12
        - generic [ref=f19e67]:
