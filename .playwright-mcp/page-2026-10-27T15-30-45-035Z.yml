      - heading "Glossary" [level=1] [ref=f19e14]
      - paragraph [ref=f19e15]: Every term the full track uses, defined in one line each. Each entry names the chapter where the concept is taught in full — so a word you met in chapter 6 is always one page away in chapter 13.
      - generic [ref=f19e16]:
        - generic [ref=f19e17]:
