  - main [ref=f1e11]:
    - generic [ref=f1e12]:
      - paragraph [ref=f1e13]: Legal
      - heading "Privacy policy" [level=1] [ref=f1e14]
      - paragraph [ref=f1e15]: "Last updated: October 2026 · Applies to hdlforge.dev"
      - paragraph [ref=f1e16]: "Short version: we store the minimum needed to run a learning platform — your Google profile basics and your progress. No ads, no trackers, no data sales. You can delete everything yourself, in one click, at any time."
      - generic [ref=f1e17]:
        - generic [ref=f1e18]:
          - heading "What we store" [level=2] [ref=f1e19]
          - generic [ref=f1e20]:
            - paragraph [ref=f1e21]: When you sign in with Google we store your name, email address, profile image URL, and your Google account's provider-side ID — nothing more from your Google profile.
            - paragraph [ref=f1e22]: "As you use the platform we store your learning progress: which lessons and problem sets you completed, when you completed them, your per-problem-set scores, and the signed receipts that back your certificate. These rows are tied to your account ID."
            - paragraph [ref=f1e23]: Each browser session stores a single session cookie ("better-auth.session_token") so you stay signed in. It contains a random session identifier — nothing else. We use no advertising cookies, no analytics cookies, and no cross-site tracking.
        - generic [ref=f1e24]:
          - heading "Anonymous use" [level=2] [ref=f1e25]
          - generic [ref=f1e26]:
            - paragraph [ref=f1e27]: You can use the entire curriculum without an account. In that mode your progress is stored only in your browser's localStorage on your own device — it is never transmitted to us, and clearing your browser data removes it permanently.
            - paragraph [ref=f1e28]: Progress saved this way only reaches our servers when you sign in and explicitly merge it into your account.
        - generic [ref=f1e29]:
          - heading "Google OAuth" [level=2] [ref=f1e30]
          - generic [ref=f1e31]:
            - paragraph [ref=f1e32]: Sign-in is delegated to Google ("Sign in with Google"). We request the default openid, email, and profile scopes only — we never post on your behalf, read your contacts, or access anything beyond the profile fields above.
            - paragraph [ref=f1e33]: Google handles the authentication step; we receive only the minimal profile data needed to create your account.
        - generic [ref=f1e34]:
          - heading "Infrastructure processors" [level=2] [ref=f1e35]
          - paragraph [ref=f1e37]: The site is hosted on Vercel (web hosting), with a managed Postgres database (Neon) storing the account rows described above. Crash reports go to Sentry only when an unexpected error occurs, and they are scrubbed of personal data to the extent the crash allows. Email is not used for notifications — we send no marketing email and do not sell or share your data with advertisers.
        - generic [ref=f1e38]:
          - heading "How to delete your data" [level=2] [ref=f1e39]
          - generic [ref=f1e40]:
            - paragraph [ref=f1e41]: "Sign in, open your Profile page, and use \"Delete account…\" in the Danger zone. Deletion is immediate and permanent: it removes your account, sign-in sessions, OAuth link, and every progress row including receipts and certificates."
            - paragraph [ref=f1e42]: If you used the platform anonymously, your data lives only in your browser — clear the site's localStorage (or your browser data) and nothing remains.
