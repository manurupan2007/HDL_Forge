            - complementary [ref=f3e546]:
              - paragraph [ref=f3e547]: Where x actually comes from
              - paragraph [ref=f3e548]: "Three common sources. First, a wire nothing drives: at time zero every wire is x until something assigns it, so an undriven output is x. Second, two drivers disagree — one says 0, the other says 1, and the result is x. Third, arithmetic on an x: 1 + x is x, and so is 1 & x. Once a value is x it usually spreads, which is why fixing the root cause matters more than the symptom you can see."
            - complementary [ref=f3e549]:
              - paragraph [ref=f3e550]: x is not the same as "I don't care"
              - paragraph [ref=f3e551]: In a *testbench* or a *truth table analysis* you may see x written to mean "this input is irrelevant here, I did not bother". In *hardware* an x is a real, unresolved wire. In this track, do not use x to mean don't-care. Write the 0 or 1 that the circuit actually produces. You will see this distinction bite in chapter 7 when we simplify truth tables.
            - blockquote [ref=f3e552]: Think of a spreadsheet cell. A 0 or 1 is a number you have typed in. An x is a formula that references an empty cell — Excel shows you an error, because the answer exists mathematically but not yet in the world. A z is a cell that was deliberately left blank to be filled in by a neighbour. Three distinct situations, and a careful person records which one they are in.
