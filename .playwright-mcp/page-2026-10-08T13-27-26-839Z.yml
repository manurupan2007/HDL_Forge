            - complementary [ref=f3e90]:
              - paragraph [ref=f3e91]: Why this matters for width errors
              - paragraph [ref=f3e92]: If you declare a wire as 4 bits and try to put the value 20 into it, 20 needs 5 bits and does not fit. Hardware cannot overflow on its own — there is nowhere for the extra bit to go. In software an integer just grows. In Verilog the value is forced to the width you declared, and the extra bit is thrown away. This single fact causes more silent bugs than anything else in the track, which is why it appears again in every chapter.
