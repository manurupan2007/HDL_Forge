                    - cell "the single value 0" [ref=f3e201]
            - paragraph [ref=f3e203]: "Hexadecimal exists because writing a long binary number is miserable. One hex digit is exactly four binary bits, so `8'hA0` and `8'b1010_0000` are the same 8 bits. When you count 4 bits at a time, hex is a quarter the typing. This is the only reason to care about hex in chapter 1, and it is worth it — you will read hex register dumps for the rest of the track."
            - blockquote [ref=f3e204]: "It is exactly like time. 60 seconds, 1 minute, 60 minutes, 1 hour — same duration, different notation, chosen for convenience. `4'b1010`, `4'd10` and `4'hA` are three notations for the same instant. The number in front tells you how much room the container has."
            - generic [ref=f3e205]:
              - heading "Do this on paper (5 minutes)" [level=4] [ref=f3e206]
              - list [ref=f3e207]:
                - listitem [ref=f3e208]:
                  - generic [ref=f3e209]: "1"
                  - generic [ref=f3e210]: "Write the value 10 in binary on four bits: start at the heaviest wire. 8 fits into 10, so set that bit and subtract — 2 left. 4 does not fit into 2, so leave that wire 0. 2 fits, so set that bit — 0 left, and the last wire is 0. You should get `1010`."
                - listitem [ref=f3e211]:
                  - generic [ref=f3e212]: "2"
                  - generic [ref=f3e213]: "Write `4'b1010` and `4'd10` and `4'hA` next to each other and tick that all three are ten."
                - listitem [ref=f3e214]:
                  - generic [ref=f3e215]: "3"
                  - generic [ref=f3e216]: "Convert `8'b1010_1010` to hex by splitting into two halves, `1010` and `1010`, each of which is A. Result: `8'hAA`."
                - listitem [ref=f3e217]:
                  - generic [ref=f3e218]: "4"
                  - generic [ref=f3e219]: "Convert `8'hFF` back to binary: F is 1111, so the answer is `1111_1111`."
                - listitem [ref=f3e220]:
                  - generic [ref=f3e221]: "5"
                  - generic [ref=f3e222]: "Check the width rule: `4'b1100` is twelve. Now ask what `4'd12` is — still twelve. Both fit in 4 bits."
                - listitem [ref=f3e223]:
                  - generic [ref=f3e224]: "6"
                  - generic [ref=f3e225]: "Try to break it: `4'b11000` is 24 in binary, but 24 does not fit in 4 bits. Paste it into the editor and read what Verilator says — it refuses the literal with an error, Too many digits for 4 bit number, and the build stops. iverilog is the lenient one: it prints a warning and quietly keeps 1000, which is 8. Either way the 24 you typed is gone, so always size your numbers."
            - generic [ref=f3e226]:
              - paragraph [ref=f3e227]: A mistake you will make
              - generic [ref=f3e228]:
                - paragraph [ref=f3e229]: "`4'b11000` — writing five digits into a four-bit literal."
                - paragraph [ref=f3e230]: "`5'b11000`, or work out that 24 needs 5 bits."
              - paragraph [ref=f3e231]: "Verilator rejects it loudly — the error says the literal has too many digits for its declared width, and the build stops. iverilog truncates with a warning instead: 4 bits can hold 0 to 15 only, so the leading 1 is discarded and you are left holding 8. Always check that the number fits before you type the literal."
            - generic [ref=f3e232]:
              - paragraph [ref=f3e233]: A mistake you will make
              - generic [ref=f3e234]:
                - paragraph [ref=f3e235]: "`8'b1010 1010` — a space in the middle of the digits."
                - paragraph [ref=f3e236]: "Use `8'b1010_1010` with an underscore."
              - paragraph [ref=f3e237]: "The underscore is the only character Verilog allows for readability inside a literal, which is why every wide constant in this track is written as `4'b0000_1111`. A space ends the literal and the trailing digits become a syntax error — a loud one, at least. The base letter itself is case-insensitive: `4'B1010` and `4'HA` are both legal, so writing it lowercase is our convention, not the language's rule."
            - complementary [ref=f3e238]:
              - paragraph [ref=f3e239]: Small numbers, written clearly
              - paragraph [ref=f3e240]: "For values 0 to 9 you can write them as plain decimal: `y = 0;` or `y = 9;` and Verilog fills in the width for you. It is still better practice to write the explicit form — `4'd0`, `4'd9` — because it forces you to keep track of how wide the signal is supposed to be. Explicit width is a habit that prevents bugs in this track."
