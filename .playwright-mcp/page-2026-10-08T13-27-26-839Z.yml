                    - paragraph [ref=f3e316]: Closes the box. Missing this is the single most common syntax error beginners hit, and the error message points at the *next* thing in the file rather than the one they forgot.
            - generic [ref=f3e317]:
              - paragraph [ref=f3e318]: A mistake you will make
              - generic [ref=f3e319]:
                - paragraph [ref=f3e320]: "Adding logic but forgetting `endmodule` at the end of the file."
                - paragraph [ref=f3e321]: "Always end the file with `endmodule`."
              - paragraph [ref=f3e322]: "Verilog has no other way to know the module ended, so the error is reported at some later token — often the next module's `module` keyword, with a message about an unexpected identifier. The line number in the error is not the line you forgot."
        - generic [ref=f3e323]:
          - 'heading "Driving a wire: the assign statement" [level=2] [ref=f3e324]'
          - paragraph [ref=f3e325]: One kind of statement, and it is the only one you need for everything in this chapter.
          - generic [ref=f3e327]:
            - paragraph [ref=f3e328]: "Inside the box you need to say what `y` will hold. You do that with `assign y = <an expression>;`. An *expression* is just a rule for combining values. `a & b` means \"a AND b\". `~a` means \"NOT a\". Put them together with `&&`, `||`, and you have arithmetic and logic. The `assign` keyword is not a command you run once — it is a standing rule, and that is the single most important idea in this section."
            - complementary [ref=f3e329]:
              - paragraph [ref=f3e330]: "Why `assign` is not `=`"
              - paragraph [ref=f3e331]: "In most programming languages the equals sign means \"store this value now\". In Verilog `=` inside `assign` does not store anything. It declares a permanent relationship: *y is now defined to equal that expression, right now and forever*. If `a` changes at any moment, the expression is re-evaluated and `y` follows, with no code of yours involved. The tool keeps the wire and the expression in sync by itself."
            - blockquote [ref=f3e332]: "A `assign` is a light that follows a switch. You do not push the light up every time the switch moves. You wire the light to the switch once, and the light is simply always showing the switch's current position. Software is you flipping the light by hand. Hardware is the wiring."
            - 'figure "The complete first module: a box, and one rule about what comes out of it." [ref=f3e333]':
              - code [ref=f3e336]: module top ( input wire a, input wire b, output wire y ); assign y = a & b; endmodule
              - generic [ref=f3e337]: "Read it as a sentence: y is a AND b. The trailing semicolon ends the statement, exactly like any language you have used."
            - figure "The single-character operators ( & | ^ ~ ) are bit-by-bit on vectors. The double-character ones ( && || ) work on the whole value and can produce x. You will meet the difference in chapter 3; for now, either works for 1-bit values." [ref=f3e338]:
