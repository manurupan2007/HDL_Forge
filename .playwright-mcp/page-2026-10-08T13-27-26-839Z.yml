      - generic [ref=f3e48]:
        - generic [ref=f3e49]:
          - heading "A bit is a switch, and a wire is a wire" [level=2] [ref=f3e50]
          - paragraph [ref=f3e51]: "Everything in digital hardware is built from one idea: a wire that is either pushed low or pushed high. Low we call 0. High we call 1. That single choice, repeated, is enough to compute anything — because you can build a rule that says \"this wire is high only when both those wires are high\". When people say hardware is digital, they mean exactly this: every wire is one of two states, with nothing in between. A bit is just the name for one of those on/off facts. A 4-bit signal is four of those wires bundled together and named as a group. Verilog's job is to let you describe those wires and the rules between them, in text, instead of with solder."
        - generic [ref=f3e52]:
          - heading "Describing hardware is not the same as running software" [level=2] [ref=f3e53]
          - paragraph [ref=f3e54]: "A Verilog module is not a recipe you execute line by line. It is a picture of a circuit that always exists. There is no \"then\" in hardware — everything is happening at once, all the time. This is why Verilog has no `if` at the top level and no loop at the top level. Instead you write rules: \"this output equals that expression\". The tool reads all your rules together and builds the circuit. The word *synthesis* just means that conversion — turning your written rules into a real netlist of gates. This chapter is called Synthesis Foundations because everything later in the track is a more elaborate way of writing rules that become gates."
      - generic [ref=f3e55]:
        - generic [ref=f3e56]:
          - heading "What a bit actually is" [level=2] [ref=f3e57]
          - paragraph [ref=f3e58]: "Before any syntax, the physical idea: a wire is low or high, and that is all a bit is."
          - generic [ref=f3e60]:
            - blockquote [ref=f3e61]: "Picture a light switch. It has two positions: off and on. A wire in a digital circuit is the same thing — a single switch, permanently in one of two positions. Electrically, 0 means \"pulled down to ground\" and 1 means \"pulled up to the supply rail\". Nobody has ever put a genuine 0.7 volts on a digital wire and called it a third state. That is why the word *bit* (binary digit) is honest: a bit has exactly two values, so one bit can carry exactly one bit of information."
            - paragraph [ref=f3e62]: Now the useful consequence. If one wire has two possible values, and you want to remember one of several things, you count. One bit distinguishes 2 things. Two bits, used as a pair, distinguish 4. Eight bits distinguish 256. Sixteen bits distinguish 65,536. Every memory size, every register width, every address you will ever write in this track is just this counting rule applied to a number of wires.
            - figure "The rule is 2 to the power of the width. 4 bits means 2⁴ = 16 values, which is why a 4-bit value tops out at 15." [ref=f3e63]:
              - table [ref=f3e65]:
                - rowgroup [ref=f3e66]:
                  - row [ref=f3e67]:
