            - complementary [ref=f3e134]:
              - paragraph [ref=f3e135]: The leftmost bit is the heaviest
              - paragraph [ref=f3e136]: "In `[3:0]`, a[3] has a value of 8, a[2] is worth 4, a[1] is worth 2, a[0] is worth 1. That is binary place value, exactly like decimal place value: in 457, the 4 is worth 400 and the 7 is worth 7. The high index is on the left because that is where the biggest value goes."
