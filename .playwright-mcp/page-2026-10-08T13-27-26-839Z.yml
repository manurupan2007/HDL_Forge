        - generic [ref=f3e164]:
          - heading "Writing numbers in Verilog" [level=2] [ref=f3e165]
          - paragraph [ref=f3e166]: The literal format is width'basedigits — how many bits, what base, then the digits.
          - generic [ref=f3e168]:
            - paragraph [ref=f3e169]: "Writing `1010` in Verilog is ambiguous: is that one thousand and ten in decimal, or ten in binary? Verilog removes the guessing with a compact format that reads as size, then base, then the value. You have seen it already without knowing it: `4'b1010`. That is four bits, binary, one-zero-one-zero. Four pieces of information, and you only had to learn four letters."
