                    - paragraph [ref=f3e302]: "`output wire y`"
                    - paragraph [ref=f3e303]: "One pin, going out, one bit wide. Note the port is only a *name* here — nothing says what `y` will hold. That comes next."
                - listitem [ref=f3e304]:
