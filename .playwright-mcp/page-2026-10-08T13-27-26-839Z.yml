              - heading "Do this on paper (3 minutes)" [level=4] [ref=f3e554]
              - list [ref=f3e555]:
                - listitem [ref=f3e556]:
                  - generic [ref=f3e557]: "1"
                  - generic [ref=f3e558]: "Write the rule: an AND with an x is x. So `1'b1 & 1'bx` = `1'bx`, and `1'b0 & 1'bx` = ? (Answer: 0, because ANDing with 0 forces 0 no matter what.)"
                - listitem [ref=f3e559]:
                  - generic [ref=f3e560]: "2"
