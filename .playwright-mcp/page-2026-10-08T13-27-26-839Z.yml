        - generic [ref=f3e251]:
          - heading "A module is a box with pins" [level=2] [ref=f3e252]
          - paragraph [ref=f3e253]: "The unit of hardware: a name, a list of pins, and a description of what happens inside."
          - generic [ref=f3e255]:
            - blockquote [ref=f3e256]: "A module is a black box. You cannot see inside it, you only know what goes in and what comes out. The list of pins is the guarantee: an `input` is a wire that pushes a value in, an `output` is a wire that hands a value back. If someone hands you a black box and you are told \"two inputs, one output, and the output is high when both inputs are high\", you can use it correctly without ever knowing how it was built. That is the entire point, and it is why modules are the foundation of every large design."
            - paragraph [ref=f3e257]: "Writing one is three things: the keyword `module`, a name, and a parenthesised port list. The port list is where direction and width live. The word `wire` in the port list says this is a plain wire — a connection, not a storage element. For now, every port is a `wire`, and that will be true for most of the track."
            - figure "The smallest useful module. Two inputs in, one output out." [ref=f3e258]:
              - code [ref=f3e261]: module top ( input wire a, input wire b, output wire y ); // The inside of the box goes here. endmodule
              - generic [ref=f3e262]: The trailing comma after each port is just style. It lets you add or remove a line without touching the line above it, which matters when a module has eight ports and you are editing them at midnight.
            - generic [ref=f3e263]:
              - generic [ref=f3e264]:
                - term [ref=f3e265]: module
                - definition [ref=f3e266]: One piece of hardware with a name and a fixed list of pins.
              - generic [ref=f3e267]:
                - term [ref=f3e268]: port
                - definition [ref=f3e269]: A pin on that box. The only way anything connects to the inside.
              - generic [ref=f3e270]:
                - term [ref=f3e271]: input
                - definition [ref=f3e272]: A pin that pushes a value into the box. From the box's point of view, something outside drives it.
              - generic [ref=f3e273]:
                - term [ref=f3e274]: output
                - definition [ref=f3e275]: A pin the box drives. From the box's point of view, the box is the one pushing a value out.
              - generic [ref=f3e276]:
                - term [ref=f3e277]: wire
                - definition [ref=f3e278]: A plain connection, like a copper track. It carries a value, it does not remember one.
            - paragraph [ref=f3e279]: "Direction is from the module's own point of view, and this trips up almost everyone once. Inside `top`, an `output` is a wire the module drives. But from *outside* `top`, that same pin is a wire that must be driven by whoever connects to it. Two different views of one pin. If a pin is `inout` — readable and writable from both sides — it is how true bidirectional buses like an open-drain line are declared, and you will meet it late in the track."
            - generic [ref=f3e280]:
              - heading "Read the smallest module line by line" [level=4] [ref=f3e281]
              - list [ref=f3e282]:
                - listitem [ref=f3e283]:
