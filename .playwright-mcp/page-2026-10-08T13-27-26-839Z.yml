        - generic [ref=f3e103]:
          - 'heading "Grouping bits: vectors and widths" [level=2] [ref=f3e104]'
          - paragraph [ref=f3e105]: "Four wires in a row is a 4-bit signal, and `[3:0]` is how you say which end is which."
          - generic [ref=f3e107]:
            - paragraph [ref=f3e108]: "You almost never care about one wire alone. You want a whole number: a byte, a counter value, a shift amount. So you bundle wires into a group and give the group a name. That group is called a *vector*. Its width — 4, 8, 16 — is the number of wires in the bundle. When you declare `wire [3:0] a`, you are saying: make four wires, name them a[3], a[2], a[1], a[0], and let people refer to the whole bundle as `a`."
            - blockquote [ref=f3e109]: "A vector is a row of toggle switches on a mixing desk, each labelled left to right. The bracket notation `[3:0]` is the labels on those switches, and the order of the labels is the part people get wrong. The number before the colon is the *high* end (the biggest place value) and the number after is the *low* end. `[3:0]` reads \"counting down from 3 to 0\", so bit 3 sits on the left and is the most significant bit."
            - 'figure "`[3:0]` and `[0:3]` describe the same width. They differ only in which index is the leftmost. The rule in this track: always write the high index first, `[7:0]`, so the number reads the same way it is written on paper." [ref=f3e110]':
