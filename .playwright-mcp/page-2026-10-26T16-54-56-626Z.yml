          - paragraph [ref=f2e20]: "HDL Forge is a free, open-access web platform for learning Verilog hardware description: guided chapters, in-browser simulation, automatically graded problem sets, and a verifiable certificate of completion. The service is provided as-is, without warranty of any kind — the curriculum is a study aid, not a substitute for formal instruction."
        - generic [ref=f2e21]:
          - heading "What the certificate means" [level=2] [ref=f2e22]
          - generic [ref=f2e23]:
            - paragraph [ref=f2e24]: "The certificate of completion is evidence-of-coursework: a signed record that a learner cleared every chapter problem set's autograder on this platform at a stated time. It attests to performance on this track's automated exercises — nothing else."
            - paragraph [ref=f2e25]: It is NOT an accredited academic credential. It is not a degree, not a professional licensure, not a substitute for a university course, and it confers no academic credit at any institution. HDL Forge is not accredited by any educational authority.
            - paragraph [ref=f2e26]: "Employers reading a certificate should treat it the way CS50's certificate is treated: a credible, verifiable signal of self-driven coursework. Its signature can be checked publicly against the verification page, so its claims are auditable."
            - paragraph [ref=f2e27]: We may revoke a certificate if it was obtained through abuse of the autograder (see below).
        - generic [ref=f2e28]:
          - heading "Acceptable use" [level=2] [ref=f2e29]
          - generic [ref=f2e30]:
            - paragraph [ref=f2e31]: "You may use the platform freely for learning, teaching, and portfolio purposes. You may not attempt to abuse the grading or simulation endpoints: no automated bulk requests, no scraping the curriculum for republication, no attempts to forge receipts or certificate tokens, and no use of the service to run workloads unrelated to learning Verilog."
            - paragraph [ref=f2e32]: We apply per-IP rate limits to unauthenticated compute endpoints and may block clients that circumvent them.
