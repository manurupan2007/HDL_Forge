        - generic [ref=f3e19]:
          - generic [ref=f3e20]:
            - heading "Learn" [level=3] [ref=f3e21]
            - paragraph [ref=f3e22]: "There are two ways to describe a gate in Verilog: an expression (`assign y = a & b;`) or a gate primitive (`and g(y, a, b);`). They synthesize to the same hardware — the choice is about how you want to think about the circuit."
            - paragraph [ref=f3e23]: Dataflow modelling (assign) describes the Boolean equation; structural modelling (primitives) describes the gate instances and their wiring, with the output as the first port and inputs after. Because everything is built from NAND, any circuit you can draw as gates can be rebuilt with NANDs only — a classic proof of universality that you will physically verify.
            - generic [ref=f3e24]:
              - code [ref=f3e26]: "module top ( input wire a, input wire b, output wire y ); // Same function, two spellings: assign y = ~(a & b); // dataflow // nand g(y, a, b); // structural — same net endmodule"
              - paragraph [ref=f3e27]: With gate primitives the output net must be declared before use, and Verilator warns with IMPLICIT if you forgot to declare a net it infers.
            - list [ref=f3e28]:
              - listitem [ref=f3e29]:
                - generic [ref=f3e31]: "The NOT of AND is NAND, and NOT alone is `not` (built-in). A NOT made of NAND is `nand (y, i, i);` — both inputs tied together."
              - listitem [ref=f3e32]:
                - generic [ref=f3e34]: XOR built from four NANDs is a rite of passage; check every one of the four input rows in a truth table, not just two.
              - listitem [ref=f3e35]:
                - generic [ref=f3e37]: Unused output? Verilator says UNUSED. Input no one drives? UNDRIVEN. Both are info-level style notes here, not errors.
          - generic [ref=f3e38]:
            - heading "Objective" [level=3] [ref=f3e39]
            - paragraph [ref=f3e40]: "Write combinational gates two ways — `assign` expressions and gate primitives — and derive any gate from NANDs."
