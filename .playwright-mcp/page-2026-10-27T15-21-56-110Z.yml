          - generic [ref=f6e19]:
            - generic [ref=f6e20]:
              - term [ref=f6e21]: Active-low
              - definition [ref=f6e22]: A control that does its job when it reads 0 (e.g. rst_n); the _n suffix is the convention.
              - definition [ref=f6e23]: ch 8
            - generic [ref=f6e24]:
              - term [ref=f6e25]: ALU
              - definition [ref=f6e26]: Arithmetic Logic Unit — a combinational block that computes add/sub/logic/compare operations selected by an opcode.
              - definition [ref=f6e27]: ch 12
            - generic [ref=f6e28]:
              - term [ref=f6e29]: Always block
              - definition [ref=f6e30]: "Verilog's procedural container: always @(*) re-computes like a circuit, always @(posedge clk) acts once per clock edge."
              - definition [ref=f6e31]: ch 3
            - generic [ref=f6e32]:
              - term [ref=f6e33]: Assign
              - definition [ref=f6e34]: "A continuous assignment: the output re-computes whenever any input changes — hardware, not a one-time statement."
              - definition [ref=f6e35]: ch 1
            - generic [ref=f6e36]:
              - term [ref=f6e37]: Asynchronous reset
              - definition [ref=f6e38]: A reset that acts immediately, without waiting for a clock edge.
              - definition [ref=f6e39]: ch 8
        - generic [ref=f6e40]:
          - heading "B" [level=2] [ref=f6e41]
          - generic [ref=f6e42]:
            - generic [ref=f6e43]:
              - term [ref=f6e44]: Baud
              - definition [ref=f6e45]: The serial bit rate of a UART link; one baud tick is the time slot of one bit.
              - definition [ref=f6e46]: ch 14
            - generic [ref=f6e47]:
              - term [ref=f6e48]: Baud tick
              - definition [ref=f6e49]: A one-cycle pulse of baud_en that advances the UART state machine by exactly one bit time.
              - definition [ref=f6e50]: ch 14
            - generic [ref=f6e51]:
              - term [ref=f6e52]: Bit
              - definition [ref=f6e53]: "One binary wire or value: it is either 0 or 1, forever."
              - definition [ref=f6e54]: ch 1
            - generic [ref=f6e55]:
              - term [ref=f6e56]: Blocking assignment
              - definition [ref=f6e57]: "The = of procedural code: statements run strictly in order. Wrong inside clocked blocks — use nonblocking there."
              - definition [ref=f6e58]: ch 8
            - generic [ref=f6e59]:
              - term [ref=f6e60]: Boot image
              - definition [ref=f6e61]: The fixed memory contents a ROM starts with, often loaded from a text file with $readmemh.
              - definition [ref=f6e62]: ch 13
            - generic [ref=f6e63]:
              - term [ref=f6e64]: Bypass
              - definition [ref=f6e65]: A mux that shortcuts freshly-written data to a reader in the same cycle (the write-first read-during-write trick).
              - definition [ref=f6e66]: ch 12
        - generic [ref=f6e67]:
