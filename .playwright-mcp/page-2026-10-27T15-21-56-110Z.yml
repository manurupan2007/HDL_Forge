          - generic [ref=f6e69]:
            - generic [ref=f6e70]:
              - term [ref=f6e71]: Carry-out
              - definition [ref=f6e72]: "A adder's over-bit: the bit that no longer fits the result width."
              - definition [ref=f6e73]: ch 5
            - generic [ref=f6e74]:
              - term [ref=f6e75]: Case
              - definition [ref=f6e76]: A procedural multi-way branch; it must cover every possible value (or have a default) or it silently builds a latch.
              - definition [ref=f6e77]: ch 4
            - generic [ref=f6e78]:
              - term [ref=f6e79]: Casez
              - definition [ref=f6e80]: A case variant that treats ? items as don't-care — the idiom for priority matching.
              - definition [ref=f6e81]: ch 7
            - generic [ref=f6e82]:
              - term [ref=f6e83]: Clock
              - definition [ref=f6e84]: The periodic signal that paces all sequential logic; registers only change on its edge.
              - definition [ref=f6e85]: ch 8
            - generic [ref=f6e86]:
              - term [ref=f6e87]: Combinational
              - definition [ref=f6e88]: Logic whose output is a pure function of its current inputs — no memory, no clock.
              - definition [ref=f6e89]: ch 3
            - generic [ref=f6e90]:
              - term [ref=f6e91]: Concatenation
              - definition [ref=f6e92]: "{a, b} — joining signals bit-wise into one wider value."
              - definition [ref=f6e93]: ch 3
            - generic [ref=f6e94]:
              - term [ref=f6e95]: Counter
              - definition [ref=f6e96]: A register that increments (usually with wraparound) on every enabled clock edge.
              - definition [ref=f6e97]: ch 9
