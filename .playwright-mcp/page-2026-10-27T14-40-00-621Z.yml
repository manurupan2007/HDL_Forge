            - generic [ref=e305]:
              - term [ref=e306]: Truth table
              - definition [ref=e307]: The complete input → output map of a combinational block.
              - definition [ref=e308]: ch 1
            - generic [ref=e309]:
              - term [ref=e310]: Two's complement
              - definition [ref=e311]: Signed binary where negation is ~x + 1 and the MSB is the sign.
              - definition [ref=e312]: ch 6
