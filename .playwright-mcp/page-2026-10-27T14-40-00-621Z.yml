      - paragraph [ref=e13]: Reference
      - heading "Glossary" [level=1] [ref=e14]
      - paragraph [ref=e15]: Every term the full track uses, defined in one line each. Each entry names the chapter where the concept is taught in full — so a word you met in chapter 6 is always one page away in chapter 13.
      - generic [ref=e16]:
        - generic [ref=e17]:
          - heading "A" [level=2] [ref=e18]
          - generic [ref=e19]:
            - generic [ref=e20]:
              - term [ref=e21]: Active-low
              - definition [ref=e22]: A control that does its job when it reads 0 (e.g. rst_n); the _n suffix is the convention.
              - definition [ref=e23]: ch 8
            - generic [ref=e24]:
              - term [ref=e25]: ALU
              - definition [ref=e26]: Arithmetic Logic Unit — a combinational block that computes add/sub/logic/compare operations selected by an opcode.
              - definition [ref=e27]: ch 12
            - generic [ref=e28]:
              - term [ref=e29]: Always block
              - definition [ref=e30]: "Verilog's procedural container: always @(*) re-computes like a circuit, always @(posedge clk) acts once per clock edge."
              - definition [ref=e31]: ch 3
            - generic [ref=e32]:
              - term [ref=e33]: Assign
              - definition [ref=e34]: "A continuous assignment: the output re-computes whenever any input changes — hardware, not a one-time statement."
              - definition [ref=e35]: ch 1
            - generic [ref=e36]:
              - term [ref=e37]: Asynchronous reset
              - definition [ref=e38]: A reset that acts immediately, without waiting for a clock edge.
              - definition [ref=e39]: ch 8
        - generic [ref=e40]:
          - heading "B" [level=2] [ref=e41]
          - generic [ref=e42]:
            - generic [ref=e43]:
              - term [ref=e44]: Baud
              - definition [ref=e45]: The serial bit rate of a UART link; one baud tick is the time slot of one bit.
              - definition [ref=e46]: ch 14
            - generic [ref=e47]:
              - term [ref=e48]: Baud tick
              - definition [ref=e49]: A one-cycle pulse of baud_en that advances the UART state machine by exactly one bit time.
              - definition [ref=e50]: ch 14
            - generic [ref=e51]:
              - term [ref=e52]: Bit
              - definition [ref=e53]: "One binary wire or value: it is either 0 or 1, forever."
              - definition [ref=e54]: ch 1
            - generic [ref=e55]:
              - term [ref=e56]: Blocking assignment
              - definition [ref=e57]: "The = of procedural code: statements run strictly in order. Wrong inside clocked blocks — use nonblocking there."
              - definition [ref=e58]: ch 8
            - generic [ref=e59]:
              - term [ref=e60]: Boot image
              - definition [ref=e61]: The fixed memory contents a ROM starts with, often loaded from a text file with $readmemh.
              - definition [ref=e62]: ch 13
            - generic [ref=e63]:
              - term [ref=e64]: Bypass
              - definition [ref=e65]: A mux that shortcuts freshly-written data to a reader in the same cycle (the write-first read-during-write trick).
              - definition [ref=e66]: ch 12
        - generic [ref=e67]:
          - heading "C" [level=2] [ref=e68]
          - generic [ref=e69]:
            - generic [ref=e70]:
              - term [ref=e71]: Carry-out
              - definition [ref=e72]: "A adder's over-bit: the bit that no longer fits the result width."
              - definition [ref=e73]: ch 5
            - generic [ref=e74]:
              - term [ref=e75]: Case
              - definition [ref=e76]: A procedural multi-way branch; it must cover every possible value (or have a default) or it silently builds a latch.
              - definition [ref=e77]: ch 4
            - generic [ref=e78]:
              - term [ref=e79]: Casez
              - definition [ref=e80]: A case variant that treats ? items as don't-care — the idiom for priority matching.
              - definition [ref=e81]: ch 7
            - generic [ref=e82]:
              - term [ref=e83]: Clock
              - definition [ref=e84]: The periodic signal that paces all sequential logic; registers only change on its edge.
              - definition [ref=e85]: ch 8
            - generic [ref=e86]:
              - term [ref=e87]: Combinational
              - definition [ref=e88]: Logic whose output is a pure function of its current inputs — no memory, no clock.
              - definition [ref=e89]: ch 3
            - generic [ref=e90]:
              - term [ref=e91]: Concatenation
              - definition [ref=e92]: "{a, b} — joining signals bit-wise into one wider value."
              - definition [ref=e93]: ch 3
            - generic [ref=e94]:
              - term [ref=e95]: Counter
              - definition [ref=e96]: A register that increments (usually with wraparound) on every enabled clock edge.
              - definition [ref=e97]: ch 9
        - generic [ref=e98]:
          - heading "D" [level=2] [ref=e99]
          - generic [ref=e100]:
            - generic [ref=e101]:
              - term [ref=e102]: Decoder
              - definition [ref=e103]: A block that turns an n-bit code into more explicit form — one-hot lines, or an instruction into control signals.
              - definition [ref=e104]: ch 7
            - generic [ref=e105]:
              - term [ref=e106]: Default
              - definition [ref=e107]: A case's catch-all branch; also the latch-prevention tool.
              - definition [ref=e108]: ch 4
            - generic [ref=e109]:
              - term [ref=e110]: Don't-care
              - definition [ref=e111]: A bit whose value doesn't affect the outcome, written ? inside casez patterns.
              - definition [ref=e112]: ch 7
            - generic [ref=e113]:
              - term [ref=e114]: Done
              - definition [ref=e115]: This track's 'machine finished' flag — raised when the microcore reaches HALT.
              - definition [ref=e116]: ch 15
            - generic [ref=e117]:
              - term [ref=e118]: Duty cycle
              - definition [ref=e119]: The fraction of a period a clock is high; 50% means equal low and high halves.
              - definition [ref=e120]: ch 9
        - generic [ref=e121]:
          - heading "E" [level=2] [ref=e122]
          - generic [ref=e124]:
            - term [ref=e125]: Enable
            - definition [ref=e126]: A gate that lets the clock/state update only when en = 1.
            - definition [ref=e127]: ch 8
        - generic [ref=e128]:
          - heading "F" [level=2] [ref=e129]
          - generic [ref=e130]:
            - generic [ref=e131]:
              - term [ref=e132]: Flip-flop
              - definition [ref=e133]: The 1-bit memory that samples its input on a clock edge and holds it until the next one.
              - definition [ref=e134]: ch 8
            - generic [ref=e135]:
              - term [ref=e136]: FSM
              - definition [ref=e137]: Finite State Machine — a state register plus next-state logic plus output logic; 'two tables and one register'.
              - definition [ref=e138]: ch 11
            - generic [ref=e139]:
              - term [ref=e140]: Full adder
              - definition [ref=e141]: Adds three bits (a, b, carry-in) and produces sum and carry-out.
              - definition [ref=e142]: ch 5
        - generic [ref=e143]:
          - heading "H" [level=2] [ref=e144]
          - generic [ref=e146]:
            - term [ref=e147]: HALT
            - definition [ref=e148]: In this track's microcore, the all-ones word 32'hFFFF_FFFF; it is matched as a whole word and stops the PC while raising done.
            - definition [ref=e149]: ch 15
        - generic [ref=e150]:
          - heading "I" [level=2] [ref=e151]
          - generic [ref=e152]:
            - generic [ref=e153]:
              - term [ref=e154]: Immediate
              - definition [ref=e155]: A constant embedded inside an instruction — the I, S, B, U and J formats in RV32I.
              - definition [ref=e156]: ch 15
            - generic [ref=e157]:
              - term [ref=e158]: ISA
              - definition [ref=e159]: "Instruction Set Architecture: the full contract of encodings and effects a CPU promises its software."
              - definition [ref=e160]: ch 15
        - generic [ref=e161]:
          - heading "L" [level=2] [ref=e162]
          - generic [ref=e163]:
            - generic [ref=e164]:
              - term [ref=e165]: Latch
              - definition [ref=e166]: "Unwanted storage created when a procedural block fails to assign an output on every path — the #1 silent-bug source for beginners."
              - definition [ref=e167]: ch 4
            - generic [ref=e168]:
              - term [ref=e169]: LSB / MSB
              - definition [ref=e170]: Least / most significant bit of a vector; UART frames send LSB first.
              - definition [ref=e171]: ch 14
            - generic [ref=e172]:
              - term [ref=e173]: Localparam
              - definition [ref=e174]: A local named constant — the right way to name FSM states instead of raw numbers.
              - definition [ref=e175]: ch 11
        - generic [ref=e176]:
          - heading "M" [level=2] [ref=e177]
          - generic [ref=e178]:
            - generic [ref=e179]:
              - term [ref=e180]: Mealy / Moore
              - definition [ref=e181]: "The two FSM output styles: Mealy reads the inputs directly, Moore depends only on the state."
              - definition [ref=e182]: ch 11
            - generic [ref=e183]:
              - term [ref=e184]: Metastability
              - definition [ref=e185]: The undefined state of a flip-flop sampled too close to its edge — the reason external signals go through synchronizers.
              - definition [ref=e186]: ch 8
            - generic [ref=e187]:
              - term [ref=e188]: Module
              - definition [ref=e189]: "Verilog's unit of design: a named block with ports, describing one circuit."
              - definition [ref=e190]: ch 1
            - generic [ref=e191]:
              - term [ref=e192]: Mux
              - definition [ref=e193]: Multiplexer — selects one of N inputs onto the output according to a select signal.
              - definition [ref=e194]: ch 4
        - generic [ref=e195]:
          - heading "N" [level=2] [ref=e196]
          - generic [ref=e197]:
            - generic [ref=e198]:
              - term [ref=e199]: Netlist
              - definition [ref=e200]: The gate-level circuit a synthesizer produces from your RTL.
              - definition [ref=e201]: ch 1
            - generic [ref=e202]:
              - term [ref=e203]: Nonblocking
              - definition [ref=e204]: "The <= of clocked blocks: right-hand sides are all sampled first, then committed together. The correct style for registers."
              - definition [ref=e205]: ch 8
        - generic [ref=e206]:
          - heading "O" [level=2] [ref=e207]
          - generic [ref=e208]:
            - generic [ref=e209]:
              - term [ref=e210]: One-hot
              - definition [ref=e211]: An encoding with exactly one bit set per state — costs flip-flops, saves decode logic.
              - definition [ref=e212]: ch 11
            - generic [ref=e213]:
              - term [ref=e214]: Opcode
              - definition [ref=e215]: The instruction field that selects which operation the datapath performs.
              - definition [ref=e216]: ch 12
        - generic [ref=e217]:
          - heading "P" [level=2] [ref=e218]
          - generic [ref=e219]:
            - generic [ref=e220]:
              - term [ref=e221]: Part-select
              - definition [ref=e222]: "Slicing a range out of a vector: fixed (x[7:4]) or variable (x[base +: 4])."
              - definition [ref=e223]: ch 3
            - generic [ref=e224]:
              - term [ref=e225]: PC
              - definition [ref=e226]: Program counter — the register holding the address of the instruction being executed.
              - definition [ref=e227]: ch 15
            - generic [ref=e228]:
              - term [ref=e229]: Port
              - definition [ref=e230]: A module's declared input or output; the module's whole interface to the outside.
              - definition [ref=e231]: ch 1
            - generic [ref=e232]:
              - term [ref=e233]: Priority encoder
              - definition [ref=e234]: Encodes the highest-priority active request line into its index, with a valid flag for 'any line active'.
              - definition [ref=e235]: ch 7
        - generic [ref=e236]:
          - heading "R" [level=2] [ref=e237]
          - generic [ref=e238]:
            - generic [ref=e239]:
              - term [ref=e240]: Registered
              - definition [ref=e241]: Sampled on a clock edge — one cycle of latency compared with combinational logic.
              - definition [ref=e242]: ch 13
            - generic [ref=e243]:
              - term [ref=e244]: Register file
              - definition [ref=e245]: The CPU's small multiported memory of architectural registers; 2R1W means two read ports and one write port.
              - definition [ref=e246]: ch 12
            - generic [ref=e247]:
              - term [ref=e248]: Reset
              - definition [ref=e249]: The signal that forces a design into a known state; it can be synchronous (waits for the clock) or asynchronous (does not), and active-high or active-low.
              - definition [ref=e250]: ch 8
            - generic [ref=e251]:
              - term [ref=e252]: Rotate
              - definition [ref=e253]: A shift whose fallen-off bits wrap around to the opposite end instead of disappearing.
              - definition [ref=e254]: ch 10
            - generic [ref=e255]:
              - term [ref=e256]: Reduction operator
              - definition [ref=e257]: A one-operand &, |, or ^ that folds a whole vector into a single bit (e.g. ^x gives parity).
              - definition [ref=e258]: ch 3
            - generic [ref=e259]:
              - term [ref=e260]: Ripple-carry
              - definition [ref=e261]: Adder structure where each stage's carry-out feeds the next stage's carry-in.
              - definition [ref=e262]: ch 5
        - generic [ref=e263]:
          - heading "S" [level=2] [ref=e264]
          - generic [ref=e265]:
            - generic [ref=e266]:
              - term [ref=e267]: Sensitivity list
              - definition [ref=e268]: The always block's event trigger; @(*) means 'recompute whenever anything I read changes'.
              - definition [ref=e269]: ch 3
            - generic [ref=e270]:
              - term [ref=e271]: Sequential
              - definition [ref=e272]: Logic clocked on an edge that remembers its state between edges.
              - definition [ref=e273]: ch 8
            - generic [ref=e274]:
              - term [ref=e275]: Shift register
              - definition [ref=e276]: A chain of flip-flops moving data one position per enabled clock.
              - definition [ref=e277]: ch 10
            - generic [ref=e278]:
              - term [ref=e279]: Sign-extension
              - definition [ref=e280]: "Widening a signed value by copying its sign bit into the new high positions: {{4{x[3]}}, x}."
              - definition [ref=e281]: ch 6
            - generic [ref=e282]:
              - term [ref=e283]: Start / stop bit
              - definition [ref=e284]: "UART framing: 0 before the 8 data bits, 1 after — anything else is a framing error."
              - definition [ref=e285]: ch 14
            - generic [ref=e286]:
              - term [ref=e287]: Strobe
              - definition [ref=e288]: A one-cycle pulse on an input signal.
              - definition [ref=e289]: ch 9
            - generic [ref=e290]:
              - term [ref=e291]: Synchronizer
              - definition [ref=e292]: Two flip-flops in series that contain metastability risk on signals coming from outside the clock domain.
              - definition [ref=e293]: ch 8
            - generic [ref=e294]:
              - term [ref=e295]: Synthesis
              - definition [ref=e296]: The conversion of your written rules into a real netlist of gates — the idea the whole track hangs off.
              - definition [ref=e297]: ch 1
