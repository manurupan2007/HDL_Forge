          - generic [ref=f1e19]:
            - heading "Learn" [level=3] [ref=f1e20]
            - paragraph [ref=f1e21]: "\"Two paragraphs\" is the canonical synthesizable FSM style: one combinational paragraph that answers \"where do I go and what do I emit\", one registered paragraph that answers \"save it\". It reads top to bottom like a protocol."
            - paragraph [ref=f1e22]: "`always_comb` computes `next` from `state` and the inputs, and any Mealy outputs. Blocking `=` here is correct — it is combinational. `always_ff @(posedge clk or posedge rst)` then `state <= next` on the edge, nonblocking, so the transition commits one cycle later. Adding `timeunit 1ns / timeprecision 1ps` at the top of the file states the timescale formally and silences `TIMESCALEMOD`."
            - generic [ref=f1e23]:
              - code [ref=f1e25]: "`timescale 1ns / 1ps module fsm ( input logic clk, rst, go, output logic done ); typedef enum logic [1:0] { S0, S1 } state_t; state_t state, next; always_ff @(posedge clk or posedge rst) if (rst) state <= S0; else state <= next; always_comb begin next = S0; done = 1'b0; case (state) S0: if (go) begin next = S1; done = 1'b1; end S1: begin next = S0; done = 1'b0; end default: next = S0; endcase end endmodule"
              - paragraph [ref=f1e26]: "Blocking in `always_comb`, nonblocking in `always_ff` — the rule that keeps both paragraphs honest."
            - list [ref=f1e27]:
              - listitem [ref=f1e28]:
                - generic [ref=f1e30]: "Verilator's BLKSEQ flags blocking `=` inside a clocked block — the two-paragraph split makes that error visible immediately."
              - listitem [ref=f1e31]:
                - generic [ref=f1e33]: "TIMESCALEMOD warns when a module has no timescale; `timeunit/timeprecision` is the SV-native replacement for `` `timescale ``."
              - listitem [ref=f1e34]:
                - generic [ref=f1e36]: "Count every branch of the output: Mealy outputs that skip a branch will LATCH — assign defaults at the top of the combinational block."
